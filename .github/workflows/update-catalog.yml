name: Auto Update Kirmalk Catalog

on:
  schedule:
    # Runs daily at 04:00 UTC (07:00 AM Cairo / Riyadh time)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      deep:
        description: 'Run deep bulk ingestion (crawls full archive pages)'
        required: false
        type: boolean
        default: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Auto-Update Script
        run: |
          if [ "${{ github.event.inputs.deep }}" = "true" ]; then
            echo "Running deep archive ingestion & purification..."
            node scripts/auto_update.js --deep
          else
            echo "Running daily incremental ingestion & purification..."
            node scripts/auto_update.js
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add initial_data.json
          if git diff --staged --quiet; then
            echo "No updates to commit. Catalog is already up to date."
          else
            git commit -m "chore(catalog): auto-update catalog and episode servers [skip ci]"
            git push origin main
          fi
